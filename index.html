<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio - Yusof</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
}

body{
    background:#0f172a;
    color:#f8fafc;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.profile-card{
    width:100%;
    max-width:450px;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:20px;
    padding:40px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.avatar{
    width:100px;
    height:100px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#3b82f6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    font-weight:bold;
    color:white;
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

.role{
    color:#60a5fa;
    font-size:18px;
    margin-bottom:25px;
}

.section-title{
    font-size:14px;
    color:#94a3b8;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.skills{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.skill{
    background:#334155;
    padding:8px 14px;
    border-radius:999px;
    font-size:14px;
}

.fact{
    background:#0f172a;
    border-left:4px solid #3b82f6;
    padding:15px;
    text-align:left;
    border-radius:8px;
    color:#cbd5e1;
}
</style>
</head>
<body>

<div class="profile-card">
    <div class="avatar">Y</div>

    <h1>Yusof</h1>
    <p class="role">Network Engineer</p>

    <div class="section-title">Kemahiran</div>
    <div class="skills">
        <span class="skill">Linux</span>
        <span class="skill">Git</span>
        <span class="skill">Docker</span>
    </div>

    <div class="section-title">Fakta Menarik</div>
    <div class="fact">
        Suka belajar & mengkaji ilmu baru.
    </div>
</div>

</body>
</html>
