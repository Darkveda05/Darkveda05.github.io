<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yusof | Network Engineer</title>

<style>
:root{
    --bg:#0b1120;
    --card:#111827;
    --accent:#38bdf8;
    --accent2:#22c55e;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#1e293b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:var(--bg);
    overflow:hidden;
    color:var(--text);
}

/* Animated Background */
body::before,
body::after{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.25;
    animation:float 12s ease-in-out infinite;
}

body::before{
    background:#0ea5e9;
    top:-150px;
    left:-100px;
}

body::after{
    background:#22c55e;
    bottom:-150px;
    right:-100px;
    animation-delay:6s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0) translateX(0);
    }
    50%{
        transform:translateY(40px) translateX(30px);
    }
}

.card{
    position:relative;
    z-index:1;
    width:90%;
    max-width:520px;
    background:rgba(17,24,39,.9);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:40px;
    text-align:center;
    box-shadow:
        0 0 30px rgba(56,189,248,.15),
        0 20px 60px rgba(0,0,0,.5);
    animation:cardEnter 1s ease;
}

@keyframes cardEnter{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar{
    width:120px;
    height:120px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:48px;
    font-weight:700;
    background:linear-gradient(135deg,#0ea5e9,#22c55e);
    color:white;
    position:relative;
    animation:pulse 3s infinite;
}

.avatar::before{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:2px solid rgba(56,189,248,.4);
    animation:spin 12s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@keyframes pulse{
    0%,100%{
        box-shadow:0 0 25px rgba(56,189,248,.5);
    }
    50%{
        box-shadow:0 0 45px rgba(34,197,94,.7);
    }
}

h1{
    margin-top:25px;
    font-size:38px;
    letter-spacing:.5px;
}

.role{
    color:var(--accent);
    font-size:18px;
    margin-top:8px;
    margin-bottom:25px;
    font-weight:600;
}

.tagline{
    color:var(--muted);
    line-height:1.7;
    margin-bottom:30px;
}

.section{
    text-align:left;
    margin-top:20px;
}

.section h3{
    color:white;
    margin-bottom:12px;
    font-size:16px;
    letter-spacing:1px;
}

.skills{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.skill{
    background:#0f172a;
    border:1px solid #1e293b;
    padding:10px 16px;
    border-radius:999px;
    color:#e2e8f0;
    transition:.3s;
}

.skill:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
    box-shadow:0 0 15px rgba(56,189,248,.3);
}

.fact{
    background:#0f172a;
    border-left:4px solid var(--accent2);
    padding:15px;
    border-radius:12px;
    color:#cbd5e1;
    line-height:1.6;
}

.badge{
    display:inline-block;
    margin-top:25px;
    padding:10px 20px;
    border-radius:999px;
    background:linear-gradient(135deg,#0ea5e9,#22c55e);
    color:white;
    font-weight:600;
    animation:glow 2.5s infinite;
}

@keyframes glow{
    0%,100%{
        box-shadow:0 0 15px rgba(56,189,248,.4);
    }
    50%{
        box-shadow:0 0 30px rgba(34,197,94,.6);
    }
}

.footer{
    margin-top:25px;
    color:#64748b;
    font-size:14px;
}
</style>
</head>
<body>

<div class="card">

    <div class="avatar">Y</div>

    <h1>Yusof</h1>

    <div class="role">Network Engineer</div>


    <div class="section">
        <h3>⚡ KEMAHIRAN</h3>
        <div class="skills">
            <div class="skill">Linux</div>
            <div class="skill">Git</div>
            <div class="skill">Docker</div>
            <div class="skill">Cloudflare</div>
        </div>
    </div>

    <div class="section">
        <h3>🚀 FAKTA MENARIK</h3>
        <div class="fact">
            Suka belajar & mengikuti perkembangan teknologi terkini
        </div>
    </div>

    <div class="badge">
        Available For Opportunities
    </div>

    <div class="footer">
        Building Reliable Networks • Continuous Learning • Problem Solver
    </div>

</div>

</body>
</html>
